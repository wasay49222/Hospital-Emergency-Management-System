<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Emergency Management System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        input, button { padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        input { flex: 1; }
        button { background: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #2980b9; }
        button.danger { background: #e74c3c; }
        button.danger:hover { background: #c0392b; }
        button.success { background: #2ecc71; }
        button.success:hover { background: #27ae60; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #ecf0f1; color: #2c3e50; }
        .severity-1 { color: red; font-weight: bold; }
        .severity-2 { color: orange; font-weight: bold; }
        .status-treated { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 Hospital Emergency Management</h1>
        
        <div class="controls">
            <input type="number" id="pId" placeholder="ID (e.g., 101)">
            <input type="text" id="pName" placeholder="Name (e.g., John Doe)">
            <input type="number" id="pAge" placeholder="Age">
            <input type="number" id="pSeverity" placeholder="Severity (1-5)" min="1" max="5">
            <button class="success" onclick="admitPatient()">Admit Patient</button>
        </div>

        <div class="controls">
            <button onclick="treatPatient()">Treat Next Patient</button>
            <button class="danger" onclick="undoAction()">Undo Last Admission</button>
            <button onclick="loadPatients()">Refresh List</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Severity</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="patientTable">
                <!-- JavaScript will populate this -->
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = "http://localhost:8080";

        async function loadPatients() {
            try {
                const response = await fetch(`${API_URL}/patients`);
                const patients = await response.json();
                const tbody = document.getElementById("patientTable");
                tbody.innerHTML = "";

                patients.forEach(p => {
                    const row = `<tr>
                        <td>${p.id}</td>
                        <td>${p.name}</td>
                        <td>${p.age}</td>
                        <td class="severity-${p.severity}">${p.severity}</td>
                        <td class="${p.status === 'treated' ? 'status-treated' : ''}">${p.status}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                console.error("Error fetching patients:", error);
            }
        }

        async function admitPatient() {
            const id = parseInt(document.getElementById("pId").value);
            const name = document.getElementById("pName").value;
            const age = parseInt(document.getElementById("pAge").value);
            const severity = parseInt(document.getElementById("pSeverity").value);

            if (!id || !name || !age || !severity) {
                alert("Please fill in all fields!");
                return;
            }

            await fetch(`${API_URL}/admit`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id, name, age, severity })
            });

            // Clear inputs and refresh
            document.getElementById("pId").value = "";
            document.getElementById("pName").value = "";
            document.getElementById("pAge").value = "";
            document.getElementById("pSeverity").value = "";
            loadPatients();
        }

        async function treatPatient() {
            await fetch(`${API_URL}/treat`, { method: "POST" });
            loadPatients();
        }

        async function undoAction() {
            await fetch(`${API_URL}/undo`, { method: "POST" });
            loadPatients();
        }

        // Load patients when the page opens
        loadPatients();
    </script>
</body>
</html>
